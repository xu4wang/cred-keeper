# cred-keeper dashboard: serve the static page and proxy each machine's cred-keeper
# under the same origin (/api/<key>/), so the browser needs no CORS.
# Only GET/HEAD are forwarded: cred-keeper's API is read-only.
server {
    listen       80;
    server_name  usage.example.com;

    # index.html + sites.json. Keep it somewhere the nginx worker can read
    # (not a 0750 home directory when nginx runs as root).
    root   /opt/homebrew/var/www/cred-keeper-dashboard;
    index  index.html;
    add_header Cache-Control "no-cache";

    # One location per sites.json entry; the key is the path segment.
    location /api/local/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8790/;
    }
    location /api/host-b/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://cred.host-b.example.com/;     # host-b's cred-keeper behind its own reverse proxy
        proxy_set_header Host cred.host-b.example.com;
    }
}
